version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: coalgov_postgres
    environment:
      POSTGRES_DB: coalgov
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: coalgov_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/coalgov
      SECRET_KEY: coalgov-sih2026-production-secret-key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: coalgov_web
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

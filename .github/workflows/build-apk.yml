name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Build Web Production Bundle
        run: |
          cd web
          npm run build

      - name: Sync Capacitor Web Assets to Android
        run: |
          cd web
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x web/android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd web/android
          ./gradlew assembleDebug --no-daemon --info --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoalGov-AI-Android-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
